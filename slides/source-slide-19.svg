<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540">
  <rect width="960" height="540" fill="#eefbf3"/>
  <rect width="960" height="106" fill="#12572f"/>
  <text x="44" y="48" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="800" fill="#ffffff">04  |  Centros de datos e inteligencia artificial</text>
  <text x="48" y="138" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="800" fill="#12572f">Electricidad usada por centros de datos en el mundo</text>

  <rect x="42" y="165" width="565" height="283" rx="46" fill="#ffffff" stroke="#b9efd0"/>
  <text x="78" y="205" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="800" fill="#121a14">Consumo aproximado (TWh/año)</text>
  <line x1="110" y1="391" x2="545" y2="391" stroke="#cfe7da" stroke-width="2"/>

  <rect x="142" y="333" width="52" height="58" rx="8" fill="#c9f8df"/>
  <text x="168" y="316" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="900" fill="#12572f">200</text>
  <text x="168" y="424" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="850" fill="#12572f">2015</text>

  <rect x="266" y="315" width="52" height="76" rx="8" fill="#78d600"/>
  <text x="292" y="298" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="900" fill="#12572f">290</text>
  <text x="292" y="424" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="850" fill="#12572f">2022</text>

  <rect x="390" y="293" width="52" height="98" rx="8" fill="#78d600"/>
  <text x="416" y="276" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="900" fill="#12572f">415</text>
  <text x="416" y="424" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="850" fill="#12572f">2024</text>

  <rect x="514" y="205" width="52" height="186" rx="8" fill="#12572f"/>
  <text x="540" y="188" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="900" fill="#12572f">945</text>
  <text x="540" y="424" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="850" fill="#12572f">2030</text>

  <polyline points="168,333 292,315 416,293 540,205" fill="none" stroke="#12a454" stroke-width="4"/>

  <rect x="630" y="165" width="288" height="283" rx="46" fill="#ecfbf2" stroke="#b9efd0"/>
  <text x="774" y="210" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="850" fill="#12572f">De 2024 a 2030</text>
  <text x="774" y="286" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="56" font-weight="900" fill="#12a454">x2.3</text>
  <text x="774" y="326" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#1f3024">el consumo puede</text>
  <text x="774" y="350" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#1f3024">más que duplicarse</text>
  <line x1="674" y1="384" x2="874" y2="384" stroke="#b9efd0" stroke-width="2"/>
  <text x="774" y="418" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="800" fill="#12572f">La IA aumenta la demanda eléctrica.</text>

  <rect x="42" y="464" width="876" height="44" rx="7" fill="#ecfbf2" stroke="#b9efd0"/>
  <text x="480" y="491" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="800" fill="#12572f">Fuente: IEA. TWh/año = electricidad consumida durante un año.</text>
</svg>
