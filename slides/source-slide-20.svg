<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540">
  <rect width="960" height="540" fill="#eefbf3"/>
  <rect width="960" height="106" fill="#12572f"/>
  <text x="44" y="48" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="800" fill="#ffffff">07  |  Retos de la transición energética</text>

  <rect x="48" y="142" width="402" height="134" fill="#ecfbf2" stroke="#b9efd0"/>
  <circle cx="106" cy="209" r="42" fill="#bf5700"/>
  <text x="106" y="222" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="900" fill="#ffd54d">$</text>
  <text x="170" y="183" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="850" fill="#12572f">01  Costo inicial alto</text>
  <text x="170" y="224" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#2c3b32">Paneles, baterías e instalación</text>
  <text x="170" y="248" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#2c3b32">requieren inversión.</text>

  <rect x="510" y="142" width="402" height="134" fill="#ecfbf2" stroke="#b9efd0"/>
  <circle cx="568" cy="209" r="42" fill="#12572f"/>
  <circle cx="568" cy="209" r="24" fill="none" stroke="#78d600" stroke-width="8"/>
  <path d="M 550 205 C 560 197 568 197 576 205 C 586 215 596 212 592 225 C 578 224 566 232 557 222 C 550 215 542 213 550 205 Z" fill="#78d600"/>
  <text x="632" y="183" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="850" fill="#12572f">02  Desigualdad territorial</text>
  <text x="632" y="224" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#2c3b32">No todas las regiones tienen</text>
  <text x="632" y="248" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#2c3b32">el mismo sol, viento o agua.</text>

  <rect x="48" y="306" width="402" height="134" fill="#ecfbf2" stroke="#b9efd0"/>
  <circle cx="106" cy="373" r="42" fill="#18385f"/>
  <path d="M 95 342 L 123 342 L 113 369 L 129 369 L 97 407 L 105 379 L 87 379 Z" fill="#ffffff"/>
  <text x="170" y="347" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="850" fill="#12572f">03  Red eléctrica débil</text>
  <text x="170" y="388" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#2c3b32">Una red saturada o dañada</text>
  <text x="170" y="412" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#2c3b32">no recibe nueva energía.</text>

  <rect x="510" y="306" width="402" height="134" fill="#ecfbf2" stroke="#b9efd0"/>
  <circle cx="568" cy="373" r="42" fill="#8038e8"/>
  <circle cx="568" cy="358" r="13" fill="#ffd54d"/>
  <circle cx="548" cy="365" r="10" fill="#ffd54d"/>
  <circle cx="588" cy="365" r="10" fill="#ffd54d"/>
  <path d="M 540 398 C 543 378 593 378 596 398 Z" fill="#ffd54d"/>
  <path d="M 526 395 C 530 380 553 380 557 395 Z" fill="#ffd54d"/>
  <path d="M 579 395 C 583 380 606 380 610 395 Z" fill="#ffd54d"/>
  <text x="632" y="347" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="850" fill="#12572f">04  Aceptación social</text>
  <text x="632" y="388" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#2c3b32">Los proyectos grandes requieren</text>
  <text x="632" y="412" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#2c3b32">diálogo y planeación.</text>

  <rect x="42" y="464" width="876" height="44" rx="7" fill="#ecfbf2" stroke="#b9efd0"/>
  <text x="480" y="491" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="800" fill="#12572f">El cambio energético necesita tecnología, financiamiento, mantenimiento y participación social.</text>
</svg>
