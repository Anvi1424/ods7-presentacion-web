  <text x="480" y="310" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="40" font-weight="900" fill="#ffffff">Porque de nada sirve tener presupuesto</text>
  <text x="480" y="356" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="40" font-weight="900" fill="#ffffff">y apoyo técnico si no existe la voluntad</text>
