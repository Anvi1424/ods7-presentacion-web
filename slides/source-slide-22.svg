  <text x="480" y="505" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="800" fill="#12572f">Se dejaron las fuentes principales, en letra grande, para que sean legibles durante la exposición.</text>
