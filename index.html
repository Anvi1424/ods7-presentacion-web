<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ODS 7 · Presentacion web</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: #050806; }
    body {
      overflow: hidden;
      font-family: "Segoe UI", system-ui, sans-serif;
      color: white;
    }
    .deck {
      width: 100vw;
      height: 100vh;
      display: flex;
      overflow-x: auto;
      overflow-y: hidden;
      scroll-snap-type: x mandatory;
      scroll-behavior: smooth;
    }
    .deck::-webkit-scrollbar { display: none; }

    .slide {
      flex: 0 0 100vw;
      width: 100vw;
      height: 100vh;
      scroll-snap-align: start;
      display: grid;
      place-items: center;
      background: #050806;
      position: relative;
      overflow: hidden;
    }
    .slide img {
      width: 100vw;
      height: 100vh;
      object-fit: contain;
      display: block;
      user-select: none;
      -webkit-user-drag: none;
      background: #050806;
    }
    .slide video {
      width: 100vw;
      height: 100vh;
      object-fit: contain;
      display: block;
      background: #050806;
    }
    .data-slide {
      place-items: stretch;
      background: #f0fbf4;
      color: #102016;
      padding: 42px 50px 30px;
    }
    .data-wrap {
      width: 100%;
      height: 100%;
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 22px;
    }
    .data-head {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 28px;
      border-bottom: 3px solid #78d600;
      padding-bottom: 16px;
    }
    .data-kicker {
      color: #125b34;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 0.02em;
    }
    .data-title {
      margin: 7px 0 0;
      color: #0f4c2e;
      font-size: 42px;
      line-height: 1;
    }
    .data-note {
      max-width: 360px;
      color: #465a4d;
      font-size: 15px;
      line-height: 1.35;
      text-align: right;
    }
    .data-grid {
      display: grid;
      grid-template-columns: 1.05fr 1fr;
      gap: 28px;
      min-height: 0;
    }
    .data-card {
      border: 1px solid #b9efd0;
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.84);
      box-shadow: 0 16px 42px rgba(18, 91, 52, 0.08);
      padding: 26px;
      min-width: 0;
    }
    .data-card h2 {
      margin: 0 0 18px;
      color: #125b34;
      font-size: 24px;
    }
    .pie-layout {
      display: grid;
      grid-template-columns: 330px 1fr;
      align-items: center;
      gap: 24px;
    }
    .energy-pie {
      width: 320px;
      aspect-ratio: 1;
      border-radius: 50%;
      background:
        radial-gradient(circle at center, #f0fbf4 0 34%, transparent 35%),
        conic-gradient(
          #125b34 0 57%,
          #79d900 57% 91%,
          #ffd54d 91% 100%
        );
      box-shadow: inset 0 0 0 1px rgba(18, 91, 52, 0.14), 0 18px 44px rgba(18, 91, 52, 0.16);
      position: relative;
    }
    .energy-pie::after {
      content: "2025";
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      color: #125b34;
      font-size: 34px;
      font-weight: 900;
    }
    .legend {
      display: grid;
      gap: 14px;
    }
    .legend-row {
      display: grid;
      grid-template-columns: 18px 1fr auto;
      align-items: center;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid #d6f5e2;
    }
    .swatch {
      width: 18px;
      height: 18px;
      border-radius: 5px;
    }
    .legend-label {
      font-size: 20px;
      font-weight: 800;
      color: #14251a;
    }
    .legend-sub {
      display: block;
      margin-top: 2px;
      color: #5d6f63;
      font-size: 13px;
      font-weight: 600;
    }
    .legend-value {
      color: #0f4c2e;
      font-size: 30px;
      font-weight: 900;
    }
    .rank-list {
      display: grid;
      gap: 16px;
    }
    .rank-row {
      display: grid;
      grid-template-columns: 42px 1fr;
      align-items: center;
      gap: 14px;
    }
    .rank-num {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: #125b34;
      color: white;
      font-size: 21px;
      font-weight: 900;
    }
    .rank-body {
      min-width: 0;
    }
    .rank-top {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 8px;
    }
    .rank-country {
      font-size: 23px;
      color: #102016;
      font-weight: 900;
    }
    .rank-meta {
      white-space: nowrap;
      color: #596c60;
      font-size: 14px;
      font-weight: 700;
    }
    .rank-bar {
      height: 15px;
      overflow: hidden;
      border-radius: 999px;
      background: #dff5e8;
    }
    .rank-fill {
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #78d600, #125b34);
    }
    .data-takeaway {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      margin-top: 20px;
    }
    .takeaway-box {
      border-left: 6px solid #78d600;
      border-radius: 16px;
      background: #ecfbf2;
      padding: 14px 16px;
      color: #183322;
      font-size: 16px;
      font-weight: 800;
      line-height: 1.28;
    }
    .source-line {
      color: #51675a;
      font-size: 13px;
      line-height: 1.35;
      text-align: center;
    }
    .source-line strong {
      color: #125b34;
    }
    .bridge-slide,
    .school-slide,
    .closing-slide {
      place-items: stretch;
      padding: 48px 56px 38px;
    }
    .bridge-slide,
    .school-slide {
      background:
        radial-gradient(circle at 84% 16%, rgba(120, 214, 0, 0.16), transparent 28%),
        linear-gradient(135deg, #f2fbf5 0%, #e8f7ef 100%);
      color: #102016;
    }
    .bridge-shell,
    .school-shell,
    .closing-shell {
      width: 100%;
      height: 100%;
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 24px;
    }
    .slide-kicker {
      color: #125b34;
      font-size: 17px;
      font-weight: 900;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .slide-title {
      margin: 8px 0 0;
      color: #0f4c2e;
      font-size: 44px;
      line-height: 1.04;
    }
    .bridge-grid {
      display: grid;
      grid-template-columns: 1fr 120px 1fr;
      align-items: center;
      gap: 26px;
    }
    .bridge-panel,
    .school-panel {
      border: 1px solid #b9efd0;
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.86);
      box-shadow: 0 18px 48px rgba(18, 91, 52, 0.10);
      padding: 30px;
    }
    .bridge-panel h2,
    .school-panel h2 {
      margin: 0 0 22px;
      color: #125b34;
      font-size: 29px;
    }
    .number-list {
      display: grid;
      gap: 18px;
      margin: 0;
      padding: 0;
      list-style: none;
    }
    .number-list li {
      display: grid;
      grid-template-columns: 42px 1fr;
      align-items: center;
      gap: 14px;
      color: #14251a;
      font-size: 25px;
      font-weight: 900;
      line-height: 1.15;
    }
    .number-list span {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: #125b34;
      color: white;
      font-size: 21px;
    }
    .bridge-arrow {
      display: grid;
      place-items: center;
      width: 100%;
      aspect-ratio: 1;
      border-radius: 50%;
      background: #78d600;
      color: #0f4c2e;
      font-size: 62px;
      font-weight: 900;
      box-shadow: 0 18px 36px rgba(120, 214, 0, 0.22);
    }
    .slide-footnote {
      color: #52685b;
      font-size: 15px;
      font-weight: 700;
      text-align: center;
    }
    .school-grid {
      display: grid;
      grid-template-columns: 0.92fr 1.08fr;
      align-items: stretch;
      gap: 26px;
    }
    .school-visual {
      border-radius: 28px;
      background:
        linear-gradient(180deg, rgba(120, 214, 0, 0.20), transparent 56%),
        #125b34;
      color: white;
      padding: 32px;
      display: grid;
      align-content: center;
      justify-items: center;
      text-align: center;
      min-width: 0;
      box-shadow: 0 20px 50px rgba(18, 91, 52, 0.22);
    }
    .school-icon {
      width: 240px;
      height: 170px;
      position: relative;
      margin-bottom: 30px;
    }
    .school-icon::before {
      content: "";
      position: absolute;
      inset: 56px 18px 0;
      border-radius: 10px 10px 5px 5px;
      background: #ecfbf2;
      box-shadow:
        0 -48px 0 -18px #ffd54d,
        inset 32px 36px 0 -18px #78d600,
        inset -32px 36px 0 -18px #78d600;
    }
    .school-icon::after {
      content: "";
      position: absolute;
      left: 54px;
      right: 54px;
      top: 16px;
      height: 48px;
      transform: skewX(-18deg);
      border-radius: 8px;
      background: repeating-linear-gradient(90deg, #1b6a42 0 22px, #78d600 22px 36px);
      border: 5px solid #ecfbf2;
    }
    .school-visual strong {
      display: block;
      font-size: 34px;
      line-height: 1.08;
    }
    .school-visual span {
      display: block;
      margin-top: 12px;
      color: #dff5e8;
      font-size: 18px;
      font-weight: 700;
    }
    .closing-slide {
      background:
        radial-gradient(circle at 78% 22%, rgba(120, 214, 0, 0.30), transparent 30%),
        radial-gradient(circle at 12% 86%, rgba(255, 213, 77, 0.20), transparent 28%),
        #0f4c2e;
      color: #f3fff7;
    }
    .closing-shell {
      align-items: center;
      text-align: center;
    }
    .closing-label {
      justify-self: center;
      width: fit-content;
      padding: 12px 24px;
      border-radius: 999px;
      background: #78d600;
      color: #0f4c2e;
      font-size: 18px;
      font-weight: 900;
      letter-spacing: 0.04em;
    }
    .closing-quote {
      max-width: 1120px;
      justify-self: center;
      font-size: 56px;
      line-height: 1.08;
      font-weight: 900;
      letter-spacing: 0;
    }
    .closing-quote mark {
      background: transparent;
      color: #ffd54d;
    }
    .closing-foot {
      color: #dff5e8;
      font-size: 22px;
      font-weight: 800;
    }
    .deck-counter {
      position: fixed;
      right: 18px;
      bottom: 14px;
      z-index: 10;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.48);
      color: rgba(255, 255, 255, 0.86);
      font-size: 12px;
      font-family: ui-monospace, Consolas, monospace;
      letter-spacing: 0.03em;
      backdrop-filter: blur(8px);
    }
    .deck-progress {
      position: fixed;
      top: 0;
      left: 0;
      height: 3px;
      width: 0;
      background: #84cc16;
      z-index: 10;
      transition: width 0.18s ease;
    }
    .nav-btn {
      position: fixed;
      top: 50%;
      transform: translateY(-50%);
      width: 42px;
      height: 58px;
      border: 0;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.22);
      color: rgba(255, 255, 255, 0.74);
      font-size: 34px;
      line-height: 1;
      z-index: 10;
      cursor: pointer;
      backdrop-filter: blur(8px);
    }
    .nav-btn:hover { background: rgba(0, 0, 0, 0.42); color: white; }
    .nav-prev { left: 14px; }
    .nav-next { right: 14px; }

    @media (hover: none) {
      .nav-btn { display: none; }
      .deck-counter { bottom: 8px; right: 8px; }
    }
  </style>
</head>
<body>
  <main class="deck" id="deck">
    <section class="slide" data-screen-label="01 Portada"><img src="slides/source-slide-01.png" alt="Diapositiva 1" /></section>
    <section class="slide" data-screen-label="02 Video introduccion">
      <video src="videos/intro-video-web.mp4" controls preload="metadata" playsinline></video>
    </section>
    <section class="slide" data-screen-label="03 Introduccion"><img src="slides/source-slide-02.png" alt="Diapositiva 2" /></section>
    <section class="slide" data-screen-label="04 Comparacion consumo"><img src="slides/source-slide-03.png" alt="Diapositiva 3" /></section>
    <section class="slide" data-screen-label="05 Datos mundiales 2025"><img src="slides/source-slide-15.svg" alt="Diapositiva de datos mundiales recientes" /></section>
    <section class="slide" data-screen-label="06 Centros de datos"><img src="slides/source-slide-19.svg" alt="Diapositiva de centros de datos" /></section>
    <section class="slide" data-screen-label="07 Objetivo"><img src="slides/source-slide-05.png" alt="Diapositiva 5" /></section>
    <section class="slide" data-screen-label="08 Justificacion"><img src="slides/source-slide-06.png" alt="Diapositiva 6" /></section>
    <section class="slide" data-screen-label="09 Conceptos"><img src="slides/source-slide-07.png" alt="Diapositiva 7" /></section>
    <section class="slide" data-screen-label="10 Renovables"><img src="slides/source-slide-08.png" alt="Diapositiva 8" /></section>
    <section class="slide" data-screen-label="11 Retos"><img src="slides/source-slide-20.svg" alt="Diapositiva de retos" /></section>
    <section class="slide" data-screen-label="12 Problema y solucion"><img src="slides/source-slide-16.svg" alt="Diapositiva problema y solucion" /></section>
    <section class="slide" data-screen-label="13 Aplicacion escolar"><img src="slides/source-slide-17.svg" alt="Diapositiva de aplicacion escolar" /></section>
    <section class="slide" data-screen-label="14 Acciones"><img src="slides/source-slide-10.png" alt="Diapositiva 10" /></section>
    <section class="slide" data-screen-label="15 Video innovaciones">
      <video src="videos/innovation-video-web.mp4" controls preload="metadata" playsinline></video>
    </section>
    <section class="slide" data-screen-label="16 Innovacion"><img src="slides/source-slide-21.svg" alt="Diapositiva de innovacion" /></section>
    <section class="slide" data-screen-label="17 Conclusion"><img src="slides/source-slide-12.png" alt="Diapositiva 12" /></section>
    <section class="slide" data-screen-label="18 Referencias"><img src="slides/source-slide-22.svg" alt="Diapositiva de referencias APA 7" /></section>
    <section class="slide" data-screen-label="19 Cierre"><img src="slides/source-slide-18.svg" alt="Diapositiva de cierre" /></section>
  </main>

  <button class="nav-btn nav-prev" type="button" aria-label="Diapositiva anterior">‹</button>
  <button class="nav-btn nav-next" type="button" aria-label="Diapositiva siguiente">›</button>
  <div class="deck-progress" id="deck-progress" aria-hidden="true"></div>
  <div class="deck-counter" id="deck-counter">1 / 19</div>

  <script>
    (function () {
      var deck = document.getElementById('deck');
      var slides = deck.querySelectorAll('.slide');
      var counter = document.getElementById('deck-counter');
      var progress = document.getElementById('deck-progress');
      var prev = document.querySelector('.nav-prev');
      var next = document.querySelector('.nav-next');
      var KEY = 'ods7-powerpoint-web-pos';
      var active = 0;

      function setActive(i) {
        active = i;
        if (counter) counter.textContent = (i + 1) + ' / ' + slides.length;
        if (progress) progress.style.width = (((i + 1) / slides.length) * 100) + '%';
        try { localStorage.setItem(KEY, String(i)); } catch (_) {}
      }
      function go(i) {
        var target = Math.max(0, Math.min(slides.length - 1, i));
        setActive(target);
        deck.scrollTo({ left: target * deck.clientWidth, behavior: 'smooth' });
      }
      function syncFromScroll() {
        var i = Math.round(deck.scrollLeft / deck.clientWidth);
        if (i !== active && i >= 0 && i < slides.length) setActive(i);
      }
      function onKey(e) {
        if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') { e.preventDefault(); go(active + 1); }
        else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); go(active - 1); }
        else if (e.key === 'Home') { e.preventDefault(); go(0); }
        else if (e.key === 'End') { e.preventDefault(); go(slides.length - 1); }
      }

      prev.addEventListener('click', function () { go(active - 1); });
      next.addEventListener('click', function () { go(active + 1); });
      window.addEventListener('keydown', onKey, true);
      document.addEventListener('keydown', onKey, true);
      deck.addEventListener('scroll', syncFromScroll, { passive: true });

      document.body.setAttribute('tabindex', '-1');
      document.body.style.outline = 'none';
      function focusDeck() {
        try { window.focus(); document.body.focus({ preventScroll: true }); } catch (_) {}
      }
      document.addEventListener('mousedown', focusDeck);
      window.addEventListener('load', focusDeck);
      focusDeck();

      try {
        var saved = parseInt(localStorage.getItem(KEY) || '0', 10);
        if (!isNaN(saved) && saved >= 0 && saved < slides.length) {
          setActive(saved);
          deck.scrollTo({ left: saved * deck.clientWidth, behavior: 'auto' });
        } else {
          setActive(0);
        }
      } catch (_) { setActive(0); }
    })();
  </script>
</body>
</html>
